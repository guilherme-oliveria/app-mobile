<mat-sidenav-container class="layout-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <!-- Brand -->
    <div class="brand">
      <mat-icon class="brand-icon">local_shipping</mat-icon>
      <span class="brand-text">Delivery</span>
    </div>

    <!-- Menu -->
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/pedidos" routerLinkActive="active-link">
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Pedidos</span>
      </a>
      <a mat-list-item routerLink="/motoboys" routerLinkActive="active-link">
        <mat-icon matListItemIcon>two_wheeler</mat-icon>
        <span matListItemTitle>Motoboys</span>
      </a>
      <a mat-list-item routerLink="/lojas" routerLinkActive="active-link">
        <mat-icon matListItemIcon>storefront</mat-icon>
        <span matListItemTitle>Lojas</span>
      </a>

      <!-- Relatórios — visível apenas para ADMIN -->
      @if (isAdmin) {
        <a mat-list-item routerLink="/relatorios" routerLinkActive="active-link">
          <mat-icon matListItemIcon>bar_chart</mat-icon>
          <span matListItemTitle>Relatórios</span>
        </a>
      }
    </mat-nav-list>

    <!-- User info -->
    <div class="user-section">
      <mat-divider></mat-divider>
      <div class="user-info">
        <mat-icon>account_circle</mat-icon>
        <div class="user-details">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role-badge"
                [class.badge-admin]="userRole === 'ADMIN'"
                [class.badge-suporte]="userRole === 'SUPORTE'">
            {{ userRole }}
          </span>
        </div>
      </div>
      <button mat-button class="logout-btn" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Sair
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
