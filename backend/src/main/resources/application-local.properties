# ========================
# Perfil LOCAL (desenvolvimento)
# ========================
# Ativar: -Dspring.profiles.active=local
# Ou via IDE: Run Configuration → Active profiles: local

# Sobrescreve para ddl-auto=update no dev (mais prático)
# Em produção, o Flyway faz tudo via migrations
spring.jpa.hibernate.ddl-auto=update

# Flyway roda as migrations e depois o Hibernate valida
# No local, se quiser ignorar o Flyway para testar rápido:
# spring.flyway.enabled=false

# Logs SQL visíveis
spring.jpa.show-sql=true
logging.level.org.flywaydb=DEBUG

