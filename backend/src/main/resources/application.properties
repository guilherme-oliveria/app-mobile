# ========================
# Servidor
# ========================
server.port=8080

# ========================
# PostgreSQL
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/delivery_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# Flyway (versionamento de banco)
# ========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ========================
# Redis
# ========================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ========================
# RabbitMQ
# ========================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Filas
delivery.queue.entrega=fila.entrega
delivery.queue.notificacao=fila.notificacao
delivery.queue.pagamento=fila.pagamento

# ========================
# JWT
# ========================
jwt.secret=SUA_CHAVE_SECRETA_MUITO_LONGA_MINIMO_256_BITS_TROQUE_EM_PRODUCAO
jwt.expiration=86400000

# ========================
# Firebase
# ========================
firebase.credentials.path=src/main/resources/firebase-credentials.json

# ========================
# Pagar.me
# ========================
pagarme.api.url=https://api.pagar.me/core/v5
pagarme.api.key=SUA_CHAVE_PAGARME_AQUI

# ========================
# CORS
# ========================
cors.allowed-origins=http://localhost:4200,http://localhost:3000
