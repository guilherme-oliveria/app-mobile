# ========================
# Servidor
# ========================
server.port=8080

# ========================
# PostgreSQL
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/delivery_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# Flyway (versionamento de banco)
# ========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ========================
# Redis
# ========================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ========================
# RabbitMQ
# ========================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Filas (declaradas em RabbitMQConfig.java)
# fila.notificacao        → push FCM em background
# fila.entrega.criada     → notifica motoboys + admin
# fila.entrega.aceita     → notifica admin + motoboy atribuído
# fila.entrega.status     → atualiza dashboard admin em tempo real
# fila.pagamento          → processamento de pagamento Pagar.me

# ========================
# JWT
# ========================
jwt.secret=SUA_CHAVE_SECRETA_MUITO_LONGA_MINIMO_256_BITS_TROQUE_EM_PRODUCAO
jwt.expiration=86400000

# ========================
# Criptografia AES-256 (passphrase para senhas)
# ========================
# ⚠️ Em produção, configure via variável de ambiente: CRYPTO_PASSPHRASE
crypto.passphrase=/caminho/arquivo/mobile

# ========================
# Firebase
# ========================
firebase.credentials.path=src/main/resources/firebase-credentials.json

# ========================
# Pagar.me
# ========================
pagarme.api.url=https://api.pagar.me/core/v5
pagarme.api.key=SUA_CHAVE_PAGARME_AQUI

# ========================
# CORS (só afeta browsers — apps nativos Android/iOS não passam por CORS)
# ========================
# DEV:  aceita qualquer porta em localhost (Flutter Web, ng serve)
# PROD: troque para o domínio fixo do painel admin: https://admin.seudelivery.com
cors.allowed-origins=http://localhost:*,http://127.0.0.1:*


logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF