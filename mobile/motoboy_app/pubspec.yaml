name: motoboy_app
description: App do motoboy - Delivery Smart POS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.0
  dio: ^5.4.0

  # State management
  provider: ^6.1.2

  # Armazenamento local (JWT, dados offline)
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Firebase (notificações push)
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19

  # Localização GPS
  geolocator: ^11.0.0

  # WebSocket (atualizações em tempo real)
  stomp_dart_client: ^0.4.4

  # UI utilitários
  intl: ^0.19.0
  flutter_spinkit: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
